line-length = 120
target-version = "py311"

[lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C",
    "UP",
    "YTT",
    "T10",
    "T20",
    "SIM",
    "RET",
    "S",
]
ignore = [
    "E501",
    "S101",
    "S311",
]

[lint.per-file-ignores]
"**/tests/**" = ["S", "T20", "E402"]
# CLI scripts report progress on stdout.
"**/scripts/**" = ["T20"]
"**/app/seed/**" = ["T20"]

[lint.isort]
force-single-line = false
combine-as-imports = true

[format]
quote-style = "double"
indent-style = "space"
